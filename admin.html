
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAVE TEAM — Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#eee9df;font:15px Arial,sans-serif}
header{padding:18px 5%;border-bottom:1px solid #3b3223;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:900;letter-spacing:2px;color:#d8bd83}
header a{color:#d8bd83}
main{max-width:1000px;margin:25px auto;padding:0 14px}
h1,h2{color:#d8bd83}
.panel{background:#121210;border:1px solid #393125;padding:18px;border-radius:8px;margin:16px 0}
input,textarea,select{display:block;width:100%;margin:10px 0;padding:13px;background:#090909;color:#fff;border:1px solid #514634;border-radius:5px;font-size:16px;min-height:44px}
input[type=file]{padding:12px;background:#171510}
textarea{min-height:80px}
button{padding:13px 16px;background:#d8bd83;color:#111;border:0;border-radius:5px;font-weight:bold;cursor:pointer;margin:5px 3px;min-height:44px}
button.secondary{background:#29251e;color:#eee9df;border:1px solid #62533b}
button.danger{background:#4b2525;color:#fff}
.small{color:#aaa49a;font-size:13px;line-height:1.5}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stat-card{background:#121210;border:1px solid #514634;border-radius:8px;padding:14px;text-align:center}
.stat-number{display:block;color:#d8bd83;font-size:27px;font-weight:bold;margin-bottom:6px}
.item{border-top:1px solid #393125;padding:14px 0;overflow-wrap:anywhere}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.preview{max-width:180px;max-height:140px;object-fit:contain;display:block;margin:10px 0;border:1px solid #514634;border-radius:5px}
.file-box{background:#0b0b09;padding:12px;border:1px solid #393125;border-radius:6px;margin:10px 0}
@media(max-width:600px){
 .stats{grid-template-columns:repeat(2,1fr)}
 main{margin:12px auto}
 .panel{padding:14px}
 .logo{font-size:16px}
 button{width:100%;margin:5px 0}
 .actions button{width:auto;flex:1}
}
</style>
</head>
<body>
<header>
 <div class="logo">WAVE TEAM / MANAGER</div>
 <a href="index.html">Открыть сайт ↗</a>
</header>

<main>
<section id="login" class="panel">
 <h1>Панель менеджера</h1>
 <p class="small">Войди с аккаунтом Supabase.</p>
 <form id="login-form">
  <input id="email" type="email" placeholder="Email менеджера" required>
  <input id="password" type="password" placeholder="Пароль" required>
  <button type="submit">ВОЙТИ</button>
 </form>
 <p id="login-message" class="small"></p>
</section>

<section id="dashboard" class="hidden">
 <div class="stats">
  <div class="stat-card"><span class="stat-number" id="players-count">0</span><span class="small">Игроки</span></div>
  <div class="stat-card"><span class="stat-number" id="matches-count">0</span><span class="small">Матчи</span></div>
  <div class="stat-card"><span class="stat-number" id="news-count">0</span><span class="small">Новости</span></div>
  <div class="stat-card"><span class="stat-number" id="applications-count">0</span><span class="small">Заявки</span></div>
 </div>

 <div class="panel">
  <h2>Управление</h2>
  <p class="small" id="signed-in"></p>
  <button id="refresh" class="secondary">Обновить данные</button>
  <button id="logout" class="secondary">Выйти</button>
  <p id="notice" class="small" aria-live="polite"></p>
 </div>

 <div class="panel">
  <h2>Игроки и аватарки</h2>
  <form id="player-form">
   <input name="nickname" placeholder="Игровой ник" required maxlength="40">
   <input name="role" placeholder="Роль: Rifler, AWPer..." required>
   <input name="sort_order" type="number" placeholder="Порядок" value="1" required>
   <label class="small">Фотография игрока (необязательно)</label>
   <input name="photo" type="file" accept="image/*">
   <button type="submit">Добавить игрока</button>
  </form>
  <div id="players-list"></div>
 </div>

 <div class="panel">
  <h2>Турнирные таблицы</h2>
  <form id="tournament-form">
   <input name="title" placeholder="Название турнира" required>
   <textarea name="description" placeholder="Описание турнира (необязательно)"></textarea>
   <label class="small">Фотография турнирной таблицы</label>
   <input name="image" type="file" accept="image/*" required>
   <button type="submit">Загрузить турнир</button>
  </form>
  <div id="tournaments-list"></div>
 </div>

 <div class="panel">
  <h2>Player Highlights</h2>
  <form id="highlight-form">
   <input name="title" placeholder="Название видео" required>
   <input name="player_nickname" placeholder="Ник игрока" required>
   <input name="youtube_url" type="url" placeholder="Ссылка на YouTube" required>
   <textarea name="description" placeholder="Описание (необязательно)"></textarea>
   <button type="submit">Добавить хайлайт</button>
  </form>
  <div id="highlights-list"></div>
 </div>

 <div class="panel">
  <h2>Матчи</h2>
  <form id="match-form">
   <input name="opponent" placeholder="Соперник" required>
   <input name="score" placeholder="Счёт, например 0-0" value="0-0" required>
   <input name="status" placeholder="Статус: UPCOMING" value="UPCOMING" required>
   <label class="small">Дата матча</label>
   <input name="match_date" type="datetime-local">
   <button type="submit">Добавить матч</button>
  </form>
  <div id="matches-list"></div>
 </div>

 <div class="panel">
  <h2>Новости</h2>
  <form id="news-form">
   <input name="title" placeholder="Заголовок новости" required>
   <input name="category" placeholder="Категория" value="TEAM NEWS" required>
   <textarea name="body" placeholder="Текст новости" required></textarea>
   <button type="submit">Опубликовать новость</button>
  </form>
  <div id="news-list"></div>
 </div>

 <div class="panel">
  <h2>Заявки академии</h2>
  <div id="applications-list"></div>
 </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
 'https://hjtrnyufryxudqgvqkuo.supabase.co',
 'sb_publishable_q6wpqCXCpunEsIPNU2Hqjw_8Jk44FXi'
);

const $ = id => document.getElementById(id);
const loginSection = $('login');
const dashboard = $('dashboard');

function say(text){$('notice').textContent=text;}

function esc(value){
 return String(value??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}

function formData(form){
 return Object.fromEntries(new FormData(form).entries());
}

function item(title,details,id,table){
 return `<div class="item">
  <strong>${esc(title)}</strong>
  <p class="small">${esc(details)}</p>
  <button class="danger" data-delete="${esc(table)}" data-id="${esc(id)}">Удалить</button>
 </div>`;
}

async function uploadImage(file,folder){
 if(!file) throw new Error('Выбери фотографию.');
 if(!file.type.startsWith('image/')) throw new Error('Нужен файл изображения.');
 if(file.size>10*1024*1024) throw new Error('Фотография должна быть меньше 10 МБ.');

 const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
 const path=folder+'/'+Date.now()+'_'+safeName;

 const {error}=await db.storage.from('wave-media').upload(path,file,{
  cacheControl:'3600',
  upsert:false
 });

 if(error) throw error;

 const {data}=db.storage.from('wave-media').getPublicUrl(path);
 return data.publicUrl;
}

async function loadData(){
 say('Загружаем данные...');

 const [p,m,n,a,h,t]=await Promise.all([
  db.from('players').select('*').order('sort_order'),
  db.from('matches').select('*').order('created_at',{ascending:false}),
  db.from('news').select('*').order('created_at',{ascending:false}),
  db.from('academy_applications').select('*').order('created_at',{ascending:false}),
  db.from('highlights').select('*').order('created_at',{ascending:false}),
  db.from('tournaments').select('*').order('created_at',{ascending:false})
 ]);

 const failed=[p,m,n,a,h,t].find(r=>r.error);
 if(failed){say('Ошибка загрузки: '+failed.error.message);return;}

 $('players-count').textContent=p.data.length;
 $('matches-count').textContent=m.data.length;
 $('news-count').textContent=n.data.length;
 $('applications-count').textContent=a.data.length;

 $('players-list').innerHTML=p.data.map(x=>`
  <div class="item">
   <strong>${esc(x.nickname)}</strong>
   <p class="small">${esc(x.role)} · порядок ${esc(x.sort_order)}</p>
   ${x.photo_url?`<img class="preview" src="${esc(x.photo_url)}" alt="Аватар игрока">`:'<p class="small">Аватар пока не добавлен</p>'}
   <div class="file-box">
    <label class="small">Выбрать аватарку из галереи</label>
    <input type="file" accept="image/*" data-player-file="${esc(x.id)}">
    <button data-upload-player="${esc(x.id)}">Загрузить аватарку</button>
   </div>
   <button class="danger" data-delete="players" data-id="${esc(x.id)}">Удалить игрока</button>
  </div>
 `).join('')||'<p class="small">Игроков пока нет.</p>';

 $('matches-list').innerHTML=m.data.map(x=>
  item(x.opponent,x.score+' · '+x.status,x.id,'matches')
 ).join('')||'<p class="small">Матчей пока нет.</p>';

 $('news-list').innerHTML=n.data.map(x=>
  item(x.title,x.category,x.id,'news')
 ).join('')||'<p class="small">Новостей пока нет.</p>';

 $('highlights-list').innerHTML=h.data.map(x=>`
  <div class="item">
   <strong>${esc(x.title)}</strong>
   <p class="small">${esc(x.player_nickname)}</p>
   <p><a href="${esc(x.youtube_url)}" target="_blank" rel="noopener" style="color:#d8bd83">Открыть видео ↗</a></p>
   <button class="danger" data-delete="highlights" data-id="${esc(x.id)}">Удалить</button>
  </div>
 `).join('')||'<p class="small">Хайлайтов пока нет.</p>';

 $('tournaments-list').innerHTML=t.data.map(x=>`
  <div class="item">
   <strong>${esc(x.title)}</strong>
   <p class="small">${esc(x.description||'')}</p>
   ${x.image_url?`<img class="preview" src="${esc(x.image_url)}" alt="Турнирная таблица">`:''}
   <button class="danger" data-delete="tournaments" data-id="${esc(x.id)}">Удалить турнир</button>
  </div>
 `).join('')||'<p class="small">Турниров пока нет.</p>';

 $('applications-list').innerHTML=a.data.map(x=>`
  <div class="item">
   <strong>${esc(x.nickname)} · ${esc(x.age)} лет</strong>
   <p class="small">Роль: ${esc(x.role)} · Рейтинг: ${esc(x.rating)}</p>
   <p>Контакт: ${esc(x.contact)}</p>
   <p>Steam: ${esc(x.steam)}</p>
   <p>${esc(x.about)}</p>
   <label class="small">Статус заявки</label>
   <select data-app-status="${esc(x.id)}">
    ${['NEW','REVIEWING','ACCEPTED','REJECTED'].map(s=>
     `<option ${x.status===s?'selected':''}>${s}</option>`
    ).join('')}
   </select>
   <button data-save-app="${esc(x.id)}">Сохранить статус</button>
  </div>
 `).join('')||'<p class="small">Заявок пока нет.</p>';

 say('Данные обновлены.');
}

async function checkSession(){
 const {data:{session}}=await db.auth.getSession();
 loginSection.classList.toggle('hidden',!!session);
 dashboard.classList.toggle('hidden',!session);
 if(session){
  $('signed-in').textContent='Вход выполнен: '+session.user.email;
  await loadData();
 }
}

$('login-form').addEventListener('submit',async e=>{
 e.preventDefault();
 $('login-message').textContent='Выполняется вход...';
 const {error}=await db.auth.signInWithPassword({
  email:$('email').value,
  password:$('password').value
 });
 if(error){$('login-message').textContent='Ошибка входа: '+error.message;return;}
 $('login-message').textContent='';
 await checkSession();
});

$('logout').addEventListener('click',async()=>{
 await db.auth.signOut();
 await checkSession();
});

$('refresh').addEventListener('click',loadData);

$('player-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const form=e.currentTarget;
 const d=formData(form);
 try{
  let photo_url=null;
  if(d.photo&&d.photo.size) photo_url=await uploadImage(d.photo,'players');

  const {error}=await db.from('players').insert([{
   nickname:d.nickname.trim(),
   role:d.role.trim(),
   sort_order:Number(d.sort_order),
   photo_url,
   published:true
  }]);
  if(error) throw error;
  form.reset();
  say('Игрок добавлен!');
  await loadData();
 }catch(error){say('Ошибка: '+error.message);}
});

$('tournament-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const form=e.currentTarget;
 const d=formData(form);
 try{
  say('Загружаем фотографию турнира...');
  const image_url=await uploadImage(d.image,'tournaments');
  const {error}=await db.from('tournaments').insert([{
   title:d.title.trim(),
   image_url,
   description:d.description.trim(),
   published:true
  }]);
  if(error) throw error;
  form.reset();
  say('Турнир добавлен!');
  await loadData();
 }catch(error){say('Ошибка: '+error.message);}
});

$('highlight-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const form=e.currentTarget;
 const d=formData(form);
 const {error}=await db.from('highlights').insert([{
  title:d.title.trim(),
  player_nickname:d.player_nickname.trim(),
  youtube_url:d.youtube_url.trim(),
  description:d.description.trim(),
  published:true
 }]);
 if(error){say('Ошибка: '+error.message);return;}
 form.reset();
 say('Хайлайт добавлен!');
 await loadData();
});

$('match-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const form=e.currentTarget;
 const d=formData(form);
 const {error}=await db.from('matches').insert([{
  opponent:d.opponent.trim(),
  score:d.score.trim(),
  status:d.status.trim(),
  match_date:d.match_date?new Date(d.match_date).toISOString():null,
  published:true
 }]);
 if(error){say('Ошибка: '+error.message);return;}
 form.reset();
 form.elements.score.value='0-0';
 form.elements.status.value='UPCOMING';
 say('Матч добавлен.');
 await loadData();
});

$('news-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const form=e.currentTarget;
 const d=formData(form);
 const {error}=await db.from('news').insert([{
  title:d.title.trim(),
  category:d.category.trim(),
  body:d.body.trim(),
  published:true
 }]);
 if(error){say('Ошибка: '+error.message);return;}
 form.reset();
 form.elements.category.value='TEAM NEWS';
 say('Новость опубликована.');
 await loadData();
});

document.addEventListener('click',async e=>{
 const uploadButton=e.target.closest('[data-upload-player]');
 if(uploadButton){
  const id=uploadButton.dataset.uploadPlayer;
  const fileInput=document.querySelector(`[data-player-file="${CSS.escape(id)}"]`);
  const file=fileInput?.files?.[0];
  try{
   if(!file) throw new Error('Сначала выбери фотографию.');
   say('Загружаем аватарку...');
   const photo_url=await uploadImage(file,'players');
   const {error}=await db.from('players').update({photo_url}).eq('id',id);
   if(error) throw error;
   say('Аватарка обновлена!');
   await loadData();
  }catch(error){say('Ошибка: '+error.message);}
  return;
 }

 const del=e.target.closest('[data-delete]');
 if(del){
  const table=del.dataset.delete;
  if(!['players','matches','news','highlights','tournaments'].includes(table))return;
  if(!confirm('Точно удалить эту запись?'))return;
  const {error}=await db.from(table).delete().eq('id',del.dataset.id);
  if(error){say('Ошибка удаления: '+error.message);return;}
  say('Запись удалена.');
  await loadData();
  return;
 }

 const save=e.target.closest('[data-save-app]');
 if(save){
  const id=save.dataset.saveApp;
  const select=document.querySelector(`[data-app-status="${CSS.escape(id)}"]`);
  const {error}=await db.from('academy_applications')
   .update({status:select.value}).eq('id',id);
  if(error){say('Ошибка сохранения: '+error.message);return;}
  say('Статус заявки обновлён.');
  await loadData();
 }
});

db.auth.onAuthStateChange(()=>{
 setTimeout(checkSession,0);
});

checkSession();
</script>
</body>
</html>
